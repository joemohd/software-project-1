  /api/flight-bookings:
    post:
      description: >-
        One segment = one-way, two = round trip (outbound first; the return flies the reverse route after the outbound
        lands). Passenger types come from the date of birth on the outbound departure date: adult 12+, child 2-11,
        infant under 2 (no seat, 10% of the seat price). At least one adult, no more infants than adults. Extra bags: up
        to the airline's maximum per passenger, each up to the booked cabin's free baggage weight allowance (FLT-08),
        charged per flight. The booking is saved as Pending Payment and expires if not paid before holdExpiresAt. Before
        paying, view and accept policies via GET/POST /api/bookings/flight/:id/policies and /accept-policies (PAY-02).
        Prices are in cents. The reference is null until the booking is Confirmed.
      operationId: FlightBookingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightBookingDto'
      responses:
        '201':
          description: Booking summary (FLT-21)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingResponseDto'
        '400':
          description: >-
            Invalid body, same flight twice, return not the reverse route or not after the outbound arrival, cabin not
            on the flight, invalid date of birth, no adult, more infants than adults, duplicate passport, too many or
            too heavy extra bags
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Flight not found
        '409':
          description: >-
            Flight not Scheduled or already departed, airline inactive, not enough seats, or seats taken by concurrent
            bookings
      security:
        - cookie: []
      summary: Book a one-way or round-trip flight and hold the seats for 10 minutes
      tags:
        - Flight bookings
    get:
      description: >-
        Upcoming/past by the outbound flight's departure time; cancelled includes expired bookings. Each group is paged
        on its own (10 per page, newest booking first). Overdue seat holds are expired first.
      operationId: FlightBookingsController_list
      parameters:
        - name: upcomingPage
          required: false
          in: query
          description: Page of upcoming bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pastPage
          required: false
          in: query
          description: Page of past bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: cancelledPage
          required: false
          in: query
          description: Page of cancelled and expired bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingListResponseDto'
        '400':
          description: Invalid page number
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
      security:
        - cookie: []
      summary: Your flight bookings, grouped as upcoming, past and cancelled
      tags:
        - Flight bookings
  /api/flight-bookings/hold:
    post:
      description: >-
        Same as POST /api/flight-bookings. Seats are reserved atomically only if enough remain, so concurrent requests
        never book more seats than exist. Unpaid holds expire after 10 minutes and the seats are released.
      operationId: FlightBookingsController_hold
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightBookingDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingResponseDto'
        '400':
          description: Invalid body or passengers/baggage (see POST /api/flight-bookings)
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Flight not found
        '409':
          description: Flight not bookable, or not enough seats left
      security:
        - cookie: []
      summary: Hold seats for 10 minutes as a Pending Payment booking (FLT-22)
      tags:
        - Flight bookings
  /api/flight-bookings/{id}:
