      description: >-
        Assigns specific available seats in the booked cabin for one or more seated passengers on an outbound
        (segmentIndex 0) or return (segmentIndex 1) flight segment. Atomically reserves the new seat(s) on the flight
        and releases the previous seat(s). Infants travel on an adult's lap and have no seat.
      operationId: FlightBookingsController_selectSeat
      parameters:
        - name: id
          required: true
          in: path
          description: Booking id
          schema:
            type: string
      requestBody:
