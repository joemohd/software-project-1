      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '400':
          description: >-
            Nothing to update, same airports, missing local time for a changed airport, invalid times, or a city without
            a time zone
        '401':
