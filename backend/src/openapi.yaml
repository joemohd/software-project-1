      operationId: FlightBookingsController_cancellationQuote
      parameters:
        - name: id
          required: true
          in: path
          description: Booking id
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationQuoteDto'
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Booking not found (also when it is someone else's)
      security:
        - cookie: []
      summary: See the refund you would get if you cancelled now
      tags:
        - Flight bookings
  /api/flight-bookings/{id}/cancel:
    post:
      description: >-
        The booking becomes Cancelled, its seats return to sale, and the refund from the airline tiers is issued through
        Stripe (see GET /api/refunds/:id for its status). Not possible after departure.
      operationId: FlightBookingsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          description: Booking id
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFlightBookingResponseDto'
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Booking not found (also when it is someone else's)
        '409':
          description: Not Confirmed (pending, expired or already cancelled), or the flight has departed
      security:
        - cookie: []
      summary: Cancel your confirmed booking before departure and get the refund
      tags:
        - Flight bookings
  /api/flight-bookings/{id}/change-flight:
    patch:
      description: >-
        Moves one flight of the booking (segmentIndex 0 = outbound, 1 = return) to another flight on the same route, in
        the same cabin and with the same airline, for all passengers, subject to seat availability. A lower fare is
        applied at once and the difference refunded (see GET /api/refunds/:id). A higher fare returns outcome
        "payment_required": the new seats are held for 10 minutes and the change is applied only after Stripe confirms
        the difference was paid (confirm it with payment.clientSecret, or send testPaymentMethod "pm_card_visa" to pay
        right away in test mode). Until then the booking keeps its current flight. Prices are in cents.
      operationId: FlightBookingsController_changeFlight
      parameters:
        - name: id
          required: true
          in: path
          description: Booking id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFlightDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFlightResponseDto'
        '400':
          description: >-
            Invalid body, no return flight, same flight, different route or airline, cabin not on the new flight, round
            trip out of order, passenger type would change, bags over the new flight limits, or testPaymentMethod with a
            live key
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Booking or new flight not found (also when the booking is someone else's)
        '409':
          description: >-
            Booking not Confirmed, flight already departed, new flight not open, airline inactive, not enough seats,
            difference below 0.50 USD, or the booking changed at the same time
      security:
        - cookie: []
      summary: Change the date or flight of your confirmed booking (same route, cabin and airline)
      tags:
        - Flight bookings
