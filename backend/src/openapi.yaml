        min/max price filter, and sorting by price, duration or departureTime.
      operationId: FlightSearchController_search
      parameters:
        - name: departureAirportId
          required: true
          in: query
          description: Departure airport id from GET /api/airports (FLT-02, FLT-11)
          schema:
            example: 665f1c2e9b1e8a001234567a
            type: string
        - name: arrivalAirportId
          required: true
          in: query
          description: Arrival airport id from GET /api/airports (FLT-02, FLT-11)
          schema:
            example: 665f1c2e9b1e8a001234567b
            type: string
        - name: departureDate
          required: true
          in: query
          description: Local departure date at the departure airport (YYYY-MM-DD, FLT-11)
          schema:
            example: '2026-12-01'
            type: string
        - name: returnDate
          required: false
          in: query
          description: Local return departure date for round-trip search (YYYY-MM-DD, FLT-12)
          schema:
            example: '2026-12-08'
            type: string
        - name: passengers
          required: false
          in: query
          description: Total seated passengers shorthand when not splitting adults/children/infants (FLT-11)
          schema:
            minimum: 1
            example: 1
            type: number
        - name: adults
          required: false
          in: query
          description: Number of adult passengers (age 12+, at least 1, FLT-12)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: children
          required: false
          in: query
          description: Number of child passengers (ages 2-11, occupy a seat and pay cabin fare, FLT-12)
          schema:
            minimum: 0
            default: 0
            type: number
        - name: infants
          required: false
          in: query
          description: Number of infant passengers (age <2, occupy no seat, pay 10% fare, at most adults, FLT-12)
          schema:
            minimum: 0
            default: 0
            type: number
        - name: cabin
          required: false
          in: query
          description: Optional cabin class filter (Economy, Premium Economy, Business, First, FLT-12)
          schema:
            type: string
            enum:
              - Economy
              - Premium Economy
              - Business
              - First
        - name: minPrice
          required: false
          in: query
          description: Inclusive minimum cabin seat price in cents (FLT-15)
          schema:
            minimum: 0
            example: 20000
            type: number
        - name: maxPrice
          required: false
          in: query
          description: Inclusive maximum cabin seat price in cents (FLT-15)
          schema:
            minimum: 0
            example: 150000
            type: number
        - name: sortBy
          required: false
          in: query
          description: Sort results by price, duration or departureTime (FLT-15)
          schema:
            type: string
            enum:
              - price
              - duration
              - departureTime
        - name: sortOrder
          required: false
          in: query
          description: Sort direction (asc or desc)
          schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
        - name: page
          required: false
          in: query
          description: Page number (10 results per page, GEN-05)
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFlightsResponseDto'
        '400':
          description: >-
            Invalid or identical airports; invalid date or returnDate < departureDate; infants > adults; minPrice >
            maxPrice
      summary: Search one-way or round-trip flights with passenger, cabin and price filters (FLT-11, FLT-12, FLT-15)
      tags:
        - Flights
  /api/flights/{id}:
    get:
      description: >-
        Shows airline profile, flight number, departure and arrival airports with local times and time zones, flight
        duration, each cabin category with price, seats remaining, baggage allowance and seat map, and the airline
