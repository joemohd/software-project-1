            schema:
              $ref: '#/components/schemas/SelectSeatDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingResponseDto'
        '400':
          description: >-
            Invalid seat format, segmentIndex or passengerIndex out of range, infant passenger, duplicate seat, or seat
            not in the booked cabin
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Booking not found (also when it is someone else's)
        '409':
          description: >-
            Booking not Confirmed or Pending Payment, flight already departed or not Scheduled, or the chosen seat is
            already taken
      security:
        - cookie: []
      summary: Select or change seat assignments on your flight booking (FLT-28)
      tags:
        - Flight bookings
