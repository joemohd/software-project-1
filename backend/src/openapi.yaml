        password:
          type: string
        newPassword:
          type: string
          description: At least 8 characters, including at least one letter and one digit
          minLength: 8
          maxLength: 72
      required:
        - emailAddress
        - password
    LoginResponseDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
      required:
