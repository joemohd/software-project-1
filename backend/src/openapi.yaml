            - cancelled
        cabinName:
          type: string
          enum:
            - Economy
            - Premium Economy
            - Business
            - First
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/ManifestPassengerDto'
      required:
        - id
        - reference
        - status
        - cabinName
        - passengers
    FlightBookingGroupPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlightBookingResponseDto'
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
        total:
          type: number
          example: 3
      required:
        - items
        - page
        - pageSize
        - total
    FlightBookingListResponseDto:
      type: object
      properties:
        upcoming:
          $ref: '#/components/schemas/FlightBookingGroupPageDto'
        past:
          $ref: '#/components/schemas/FlightBookingGroupPageDto'
        cancelled:
          $ref: '#/components/schemas/FlightBookingGroupPageDto'
      required:
        - upcoming
        - past
        - cancelled
    FlightBookingResponseDto:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
          example: K7M2QX
          nullable: true
          description: Shown once the booking is Confirmed; null before
        status:
          type: string
          enum:
            - pending payment
            - confirmed
            - completed
            - expired
            - cancelled
          example: pending payment
        segments:
          type: array
          items:
            $ref: '#/components/schemas/BookingSegmentResponseDto'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/BookingPassengerResponseDto'
        fareTotal:
          type: integer
          description: Sum of the segment fares in cents
          example: 94500
        baggageFee:
          type: integer
          description: Extra baggage fee in cents
          example: 5000
        total:
          type: integer
          description: fareTotal + baggageFee in cents
          example: 99500
        holdExpiresAt:
          type: string
          nullable: true
          description: When the seat hold ends (UTC); pay before this
          example: '2026-11-19T12:10:00.000Z'
          format: date-time
      required:
        - id
        - reference
        - status
        - segments
        - passengers
        - fareTotal
        - baggageFee
        - total
        - holdExpiresAt
    FlightBookingsReportDto:
      type: object
      properties:
        flightId:
          type: string
        cabins:
          type: array
          items:
            $ref: '#/components/schemas/CabinSeatsDto'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlightBookingEntryDto'
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
        total:
          type: number
          example: 42
      required:
        - flightId
        - cabins
        - items
        - page
        - pageSize
        - total
    FlightResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 665f1c2e9b1e8a0012345680
        airlineId:
          type: string
          example: 665f1c2e9b1e8a0012345678
        number:
          type: string
          example: '123'
        status:
          type: string
          enum:
            - scheduled
            - cancelled
            - departed
          example: scheduled
        departure:
          $ref: '#/components/schemas/FlightStopResponseDto'
        arrival:
          $ref: '#/components/schemas/FlightStopResponseDto'
        maxBagWeight:
          type: number
          description: kg
          example: 32
        cabins:
          type: array
          items:
            $ref: '#/components/schemas/CabinSummaryDto'
      required:
        - id
        - airlineId
        - number
        - status
        - departure
        - arrival
        - maxBagWeight
        - cabins
    FlightStopResponseDto:
      type: object
      properties:
        airportId:
          type: string
          example: 665f1c2e9b1e8a001234567a
        timestamp:
          type: string
          description: Stored UTC instant
          example: '2026-12-01T08:00:00.000Z'
          format: date-time
        localTime:
          type: string
          description: Local time at the airport (no offset), e.g. 2026-12-01T10:00
          example: 2026-12-01T10:00
        timeZone:
          type: string
          example: Africa/Cairo
      required:
        - airportId
        - timestamp
        - localTime
        - timeZone
    ManifestPassengerDto:
      type: object
      properties:
        fullName:
          type: string
          example: Mona Hassan
        type:
          type: string
          enum:
            - adult
            - child
            - infant
        seat:
          type: string
          nullable: true
          example: 12A
          description: Seat on this flight; null for infants
        extraBagWeights:
          description: Extra bag weights in kg
          type: array
          items:
            type: number
      required:
        - fullName
        - type
        - seat
        - extraBagWeights
    PassengerSeatDto:
      type: object
      properties:
        segment:
          type: number
          description: 0 = outbound, 1 = return
          example: 0
        seat:
          type: string
          example: 12A
      required:
        - segment
        - seat
    UpdateBaggagePolicyDto:
      type: object
      properties:
        priceExtraBag:
          type: integer
          description: Price per extra bag in cents (must be > 0)
          example: 2500
          minimum: 1
        maxExtraBagCount:
          type: integer
          description: Maximum extra bags per passenger (>= 0)
          example: 2
          minimum: 0
      required:
        - priceExtraBag
        - maxExtraBagCount
    UpdateCabinDto:
      type: object
      properties:
        seatPrice:
          type: integer
          description: Price per seat in cents (> 0)
          example: 45000
          minimum: 1
        firstRow:
          type: integer
          description: First seat row of this cabin (inclusive)
          example: 10
          minimum: 1
          maximum: 150
        lastRow:
          type: integer
          description: Last seat row of this cabin (inclusive)
          example: 35
          minimum: 1
          maximum: 150
    UpdateCancellationPolicyDto:
      type: object
      properties:
        tiers:
          description: >-
            Up to 20 tiers. The refund uses the tier with the highest threshold not exceeding the days remaining; if none
            applies, the refund is 0%.
          type: array
          items:
            $ref: '#/components/schemas/AirlineCancellationTierDto'
      required:
        - tiers
    UpdateFlightDto:
      type: object
      properties:
        departureAirportId:
          type: string
          description: An airport from GET /api/airports
          example: 665f1c2e9b1e8a001234567a
        departureLocalTime:
          type: string
          description: Local time at the departure airport, no offset
          example: 2026-12-01T10:00
        arrivalAirportId:
          type: string
          description: An airport from GET /api/airports
          example: 665f1c2e9b1e8a001234567b
        arrivalLocalTime:
          type: string
          description: Local time at the arrival airport, no offset
          example: 2026-12-01T14:30
