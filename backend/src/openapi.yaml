          example: 156
          minimum: 1
        freeBagCount:
          type: number
          description: Free baggage allowance in number of bags per passenger (whole number >= 0, FLT-04)
          example: 1
          minimum: 0
          default: 1
        freeBagWeight:
          type: number
          description: >-
            Maximum weight per bag in whole kg for this cabin's free and extra baggage allowance (0 = none; FLT-04,
            FLT-08); can't exceed the flight's maxBagWeight
          example: 23
          minimum: 0
          maximum: 100
        firstRow:
          type: number
          description: First seat row of this cabin (inclusive)
          example: 10
          minimum: 1
          maximum: 150
        lastRow:
          type: number
          description: Last seat row of this cabin (inclusive)
          example: 35
          minimum: 1
          maximum: 150
        layout:
          type: string
          description: >-
            Seat letters per row with "-" for each aisle (at most 12 seats). Outer letters are window seats, letters
            next to "-" are aisle seats, the rest are middle.
          example: ABC-DEF
          pattern: ^[A-Z]+(-[A-Z]+)*$
