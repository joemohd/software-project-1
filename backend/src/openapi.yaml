# API contract (OpenAPI 3). Generated from the Swagger decorators in the code.
# Blog section: BLG-01 to BLG-10, BLG-12, BLG-13 (backend/src/blog).
# Teammates: add your module's paths under "paths:" and schemas under "components.schemas".

openapi: 3.0.0
info:
  title: Travel Planning and Booking API
  description: ''
  version: '1.0'
  contact: {}
tags:
  - name: Blog
    description: 'Blog and community: BLG-01 to BLG-10, BLG-12, BLG-13'
  - name: Airports
    description: 'Predefined airports, read-only: FLT-02'
  - name: Flights
    description: 'Airline moderators manage flights and cabins, see bookings, export passengers: FLT-03 to FLT-06, FLT-29'
  - name: Airlines
    description: 'Airline moderators set the baggage and cancellation policies: FLT-04, FLT-08, FLT-09'
  - name: Flight bookings
    description: 'Users book flights and see their own bookings: FLT-19, FLT-21, FLT-25'
paths:
  /api/posts:
    get:
      description: >-
        Filter by tag with "tag" and search the title, tags and author name with "q". Search results are ordered by
        likes + comments, newest first on ties; without "q" the newest posts come first.
      operationId: BlogController_listPosts
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: q
          required: false
          in: query
          description: >-
            Keyword matched against the title, tags and author name. Results are ordered by likes + comments, newest
            first on ties.
          schema:
            maxLength: 100
            type: string
        - name: tag
          required: false
          in: query
          description: Only posts with this tag.
          schema:
            maxLength: 30
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostsPageDto'
      summary: Browse or search published posts (BLG-02, BLG-09)
      tags:
        - Blog
    post:
      operationId: BlogController_createPost
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '400':
          description: Validation failed.
        '401':
          description: Not logged in.
      security:
        - access_token: []
      summary: Create a post as Draft or Published (BLG-01)
      tags:
        - Blog
  /api/posts/mine:
    get:
      operationId: BlogController_listMyPosts
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPostsPageDto'
        '401':
          description: Not logged in.
      security:
        - access_token: []
      summary: List my own posts, drafts included (BLG-03)
      tags:
        - Blog
  /api/posts/mine/{id}:
    get:
      operationId: BlogController_getMyPost
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post not found.
      security:
        - access_token: []
      summary: Open one of my posts, drafts included (BLG-03, BLG-04)
      tags:
        - Blog
  /api/posts/{id}:
    get:
      operationId: BlogController_getPost
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: commentsPage
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostDto'
        '404':
          description: Post not found, not published or hidden.
      summary: Open a published post with its like count and comments (BLG-02)
      tags:
        - Blog
    patch:
      operationId: BlogController_updatePost
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '400':
          description: Validation failed.
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post not found.
      security:
        - access_token: []
      summary: 'Edit my post: title, body, tags or status (BLG-04, BLG-08)'
      tags:
        - Blog
    delete:
      operationId: BlogController_deletePost
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Post deleted.
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post not found.
      security:
        - access_token: []
      summary: Delete my post with its likes and comments (BLG-04)
      tags:
        - Blog
  /api/posts/{id}/comments:
    post:
      operationId: BlogController_addComment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        '400':
          description: Empty comment or longer than 500 characters.
        '401':
          description: Not logged in.
        '404':
          description: Post not found or not published.
      security:
        - access_token: []
      summary: Comment on a published post (BLG-05)
      tags:
        - Blog
  /api/posts/{id}/like:
    post:
      operationId: BlogController_like
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatusDto'
        '401':
          description: Not logged in.
        '404':
          description: Post not found or not published.
        '409':
          description: You already liked this post.
      security:
        - access_token: []
      summary: Like a published post once (BLG-06)
      tags:
        - Blog
    delete:
      operationId: BlogController_unlike
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatusDto'
        '401':
          description: Not logged in.
        '404':
          description: You have not liked this post.
      security:
        - access_token: []
      summary: Remove my like from a post (BLG-06)
      tags:
        - Blog
  /api/posts/{id}/images:
    post:
      operationId: BlogController_addImage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '400':
          description: No file, wrong type, too large, or the post already has 5 images.
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post not found.
      security:
        - access_token: []
      summary: Attach a JPG or PNG image (max 5 MB, max 5 per post) to my post (BLG-10, GEN-08)
      tags:
        - Blog
  /api/posts/{id}/images/{imageId}:
    delete:
      operationId: BlogController_removeImage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: imageId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post or image not found.
      security:
        - access_token: []
      summary: Remove an image from my post (BLG-10)
      tags:
        - Blog
  /api/posts/{id}/itinerary:
    patch:
      operationId: BlogController_attachItinerary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachItineraryDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseDto'
        '401':
          description: Not logged in.
        '403':
          description: The post belongs to another user.
        '404':
          description: Post not found, or the itinerary is not one of yours.
      security:
        - access_token: []
      summary: Attach one of my itineraries to my post, or detach it (BLG-13)
      tags:
        - Blog
  /api/comments/{id}:
    patch:
      operationId: CommentsController_updateComment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        '400':
          description: Empty comment or longer than 500 characters.
        '401':
          description: Not logged in.
        '403':
          description: The comment belongs to another user.
        '404':
          description: Comment not found.
      security:
        - access_token: []
      summary: Edit my comment (BLG-07)
      tags:
        - Blog
    delete:
      operationId: CommentsController_deleteComment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted.
        '401':
          description: Not logged in.
        '403':
          description: The comment belongs to another user.
        '404':
          description: Comment not found.
      security:
        - access_token: []
      summary: Delete my comment (BLG-07)
      tags:
        - Blog
  /api/tags/{tag}/posts:
    get:
      operationId: TagsController_listByTag
      parameters:
        - name: tag
          required: true
          in: path
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostsPageDto'
      summary: List published posts with a tag, newest first (BLG-08)
      tags:
        - Blog
  /api/authors/{id}:
    get:
      operationId: AuthorsController_getAuthor
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: postsPage
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: itinerariesPage
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorPageDto'
        '404':
          description: Author not found or deactivated.
      summary: 'Public author page: name, join date, published posts and public itineraries (BLG-12)'
      tags:
        - Blog
  /api/airports:
    get:
      description: 'Who can call it: Public (no login needed).'
      operationId: AirportsController_list
      parameters:
        - name: search
          required: false
          in: query
          description: Matches the start of the IATA code or any part of the airport name
          schema:
            example: CAI
            type: string
        - name: page
          required: false
          in: query
          description: Page number, starting at 1
          schema:
            minimum: 1
            default: 1
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirportListResponseDto'
        '400':
          description: Invalid page or search value
      summary: List the predefined airports (read-only), 10 per page (FLT-02)
      tags:
        - Airports
  /api/flights:
    post:
      description: >-
        Who can call it: Airline moderator (only for the airline whose moderatorId is your user id). Times are local to
        each airport (its city's IANA time zone) and stored in UTC. Seats are generated from each cabin's rows and layout.
      operationId: FlightsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightDto'
            example:
              airlineId: 665f1c2e9b1e8a0012345678
              number: '123'
              departureAirportId: 665f1c2e9b1e8a001234567a
              departureLocalTime: 2026-12-01T10:00
              arrivalAirportId: 665f1c2e9b1e8a001234567b
              arrivalLocalTime: 2026-12-01T14:30
              maxBagWeight: 32
              cabins:
                - name: Business
                  seatPrice: 150000
                  freeBagWeight: 32
                  firstRow: 1
                  lastRow: 4
                  layout: AC-DF
                - name: Economy
                  seatPrice: 45000
                  freeBagWeight: 23
                  firstRow: 10
                  lastRow: 35
                  layout: ABC-DEF
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '400':
          description: >-
            Invalid body; same airports; unknown airport or city without a time zone; arrival not after departure;
            departure in the past; invalid cabins
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, not your airline, or the airline is deactivated
        '404':
          description: Airline not found
        '409':
          description: Flight number already used by this airline on that local departure date
      security:
        - cookie: []
      summary: Create a Scheduled flight for your airline (FLT-03)
      tags:
        - Flights
  /api/flights/{id}/cabins:
    post:
      description: 'Who can call it: Airline moderator (only for flights of the airline you moderate).'
      operationId: FlightsController_addCabin
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCabinDto'
            example:
              name: Premium Economy
              seatPrice: 90000
              freeBagWeight: 23
              firstRow: 5
              lastRow: 9
              layout: ABC-DEF
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '400':
          description: Invalid cabin, rows overlap another cabin, or free allowance above maxBagWeight
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found
        '409':
          description: Cabin type already on the flight, flight not Scheduled or already departed, or it changed meanwhile
      security:
        - cookie: []
      summary: Add a cabin type the flight does not have yet (Scheduled flights only) (FLT-04)
      tags:
        - Flights
  /api/flights/{id}/cabins/{cabinId}:
    patch:
      description: >-
        Who can call it: Airline moderator (only for flights of the airline you moderate). Added rows use the cabin's
        existing seat layout. Rows can only be removed if none of their seats is held or booked. Existing bookings keep
        their price.
      operationId: FlightsController_updateCabin
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
        - name: cabinId
          required: true
          in: path
          description: 'Cabin name, e.g. "Premium Economy" (URL-encoded: Premium%20Economy). Cabins have no separate id.'
          schema:
            enum:
              - Economy
              - Premium Economy
              - Business
              - First
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCabinDto'
            example:
              seatPrice: 50000
              lastRow: 38
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '400':
          description: Nothing to update, invalid values, or rows overlap another cabin
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found, or it has no such cabin
        '409':
          description: Rows to remove have held/booked seats, flight not Scheduled or already departed, or it changed meanwhile
      security:
        - cookie: []
      summary: Change a cabin's seat price and/or row range (Scheduled flights only) (FLT-04, FLT-05)
      tags:
        - Flights
  /api/airlines/{id}/baggage-policy:
    put:
      description: 'Who can call it: Airline moderator (only for the airline whose moderatorId is your user id).'
      operationId: AirlinesController_updateBaggagePolicy
      parameters:
        - name: id
          required: true
          in: path
          description: Airline id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBaggagePolicyDto'
            example:
              priceExtraBag: 2500
              maxExtraBagCount: 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaggagePolicyResponseDto'
        '400':
          description: Price not a whole number of cents > 0, or count < 0
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not the moderator of this airline
        '404':
          description: Airline not found
      security:
        - cookie: []
      summary: Set your airline's extra-baggage price and per-passenger limit (FLT-04, FLT-08)
      tags:
        - Airlines
  /api/flights/{id}:
    patch:
      description: >-
        Who can call it: Airline moderator (only for flights of the airline you moderate). Local times as on creation.
        Changing an airport also needs that side's local time. A side whose time is not sent keeps its stored time.
      operationId: FlightsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlightDto'
            example:
              departureLocalTime: 2026-12-01T11:00
              arrivalLocalTime: 2026-12-01T15:30
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '400':
          description: >-
            Nothing to update, same airports, missing local time for a changed airport, invalid times, or a city without a
            time zone
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found
        '409':
          description: >-
            Airports changed after a seat was held or booked, duplicate flight number on that date, flight not Scheduled
            or already departed
      security:
        - cookie: []
      summary: Change departure/arrival times (and airports, until a seat is held or booked) (FLT-05)
      tags:
        - Flights
  /api/flights/{id}/cancel:
    post:
      description: >-
        Who can call it: Airline moderator (only for flights of the airline you moderate). Sets the status to cancelled
        (hidden from search) and releases all held seats, in one atomic update.
      operationId: FlightsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponseDto'
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found
        '409':
          description: Flight not Scheduled (e.g. already cancelled) or already departed
      security:
        - cookie: []
      summary: Cancel a Scheduled flight (FLT-06)
      tags:
        - Flights
  /api/airlines/{id}/cancellation-policy:
    put:
      description: 'Who can call it: Airline moderator (only for the airline whose moderatorId is your user id).'
      operationId: AirlinesController_updateCancellationPolicy
      parameters:
        - name: id
          required: true
          in: path
          description: Airline id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCancellationPolicyDto'
            example:
              tiers:
                - daysBeforeDeparture: 30
                  refundPercentage: 100
                - daysBeforeDeparture: 7
                  refundPercentage: 50
                - daysBeforeDeparture: 1
                  refundPercentage: 20
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicyResponseDto'
        '400':
          description: Invalid tier, or duplicate daysBeforeDeparture
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not the moderator of this airline
        '404':
          description: Airline not found
      security:
        - cookie: []
      summary: Replace your airline's cancellation refund tiers (FLT-09)
      tags:
        - Airlines
  /api/flight-bookings:
    post:
      description: >-
        Who can call it: Registered user (role user); moderators and admins get 403. One segment = one-way, two = round
        trip (outbound first; the return flies the reverse route after the outbound lands). Passenger types come from the
        date of birth on the outbound departure date: adult 12+, child 2-11, infant under 2 (no seat, 10% of the seat
        price). At least one adult, no more infants than adults. Extra bags: up to the airline's maximum per passenger,
        each up to the flight's maximum bag weight, charged per flight. The booking is saved as Pending Payment and
        expires if not paid before holdExpiresAt. Prices are in cents. The reference is null until the booking is
        Confirmed.
      operationId: FlightBookingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightBookingDto'
            examples:
              oneWay:
                summary: One-way, one adult with one extra bag
                value:
                  segments:
                    - flightId: 6740c0ffee0000000000a001
                      cabinName: Economy
                  passengers:
                    - fullName: Mona Hassan
                      dateOfBirth: '1990-05-31'
                      passportNumber: A12345678
                      extraBagWeights:
                        - 20
              roundTrip:
                summary: Round trip (outbound first), one adult and one infant
                value:
                  segments:
                    - flightId: 6740c0ffee0000000000a001
                      cabinName: Economy
                    - flightId: 6740c0ffee0000000000a002
                      cabinName: Economy
                  passengers:
                    - fullName: Mona Hassan
                      dateOfBirth: '1990-05-31'
                      passportNumber: A12345678
                    - fullName: Omar Hassan
                      dateOfBirth: '2025-08-14'
                      passportNumber: B98765432
      responses:
        '201':
          description: Booking summary (FLT-21)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingResponseDto'
        '400':
          description: >-
            Invalid body, same flight twice, return not the reverse route or not after the outbound arrival, cabin not on
            the flight, invalid date of birth, no adult, more infants than adults, duplicate passport, too many or too
            heavy extra bags
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Flight not found
        '409':
          description: >-
            Flight not Scheduled or already departed, airline inactive, not enough seats, or seats taken by concurrent
            bookings
      security:
        - cookie: []
      summary: Book a one-way or round-trip flight and hold the seats for 10 minutes (FLT-19, FLT-21)
      tags:
        - Flight bookings
    get:
      description: >-
        Who can call it: Registered user (role user); moderators and admins get 403. Upcoming/past by the outbound
        flight's departure time; cancelled includes expired bookings. Each group is paged on its own (10 per page, newest
        booking first). Overdue seat holds are expired first.
      operationId: FlightBookingsController_list
      parameters:
        - name: upcomingPage
          required: false
          in: query
          description: Page of upcoming bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: integer
        - name: pastPage
          required: false
          in: query
          description: Page of past bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: integer
        - name: cancelledPage
          required: false
          in: query
          description: Page of cancelled and expired bookings, starting at 1
          schema:
            minimum: 1
            default: 1
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingListResponseDto'
        '400':
          description: Invalid page number
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
      security:
        - cookie: []
      summary: Your flight bookings, grouped as upcoming, past and cancelled (FLT-25)
      tags:
        - Flight bookings
  /api/flight-bookings/{id}:
    get:
      description: >-
        Who can call it: Registered user (role user); moderators and admins get 403. Same summary as when booking. The
        reference is null until the booking is Confirmed.
      operationId: FlightBookingsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: Booking id
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingResponseDto'
        '401':
          description: Not logged in
        '403':
          description: Not a registered user (moderator/admin), or account suspended or inactive
        '404':
          description: Booking not found (also when it is someone else's)
      security:
        - cookie: []
      summary: One of your flight bookings (FLT-25)
      tags:
        - Flight bookings
  /api/flights/{id}/bookings:
    get:
      description: >-
        Who can call it: Airline moderator (only for flights of the airline you moderate). Pending Payment and Expired
        bookings are left out. 10 per page, newest booking first. No passport numbers.
      operationId: FlightsController_listBookings
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number, starting at 1
          schema:
            minimum: 1
            default: 1
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingsReportDto'
        '400':
          description: Invalid page number
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found
      security:
        - cookie: []
      summary: Your flight's Confirmed and Cancelled bookings, with seats remaining per cabin (FLT-29)
      tags:
        - Flights
  /api/flights/{id}/passengers/export:
    get:
      description: >-
        Who can call it: Airline moderator (only for flights of the airline you moderate). One row per passenger of
        Confirmed and Cancelled bookings: reference, passenger name, type, cabin, seat, extra bags (count), status. No
        passport numbers. Cells starting with = + - @ or a tab are prefixed with a quote so spreadsheets do not run them.
      operationId: FlightsController_exportPassengers
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
      responses:
        '200':
          description: CSV file (attachment)
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: attachment; filename="<file>.csv"
              schema:
                type: string
        '401':
          description: Not logged in
        '403':
          description: Not a moderator, or not your airline's flight
        '404':
          description: Flight not found
      security:
        - cookie: []
      summary: Download the passenger list of your flight as CSV (FLT-29)
      tags:
        - Flights
