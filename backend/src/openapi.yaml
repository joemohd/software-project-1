# API contract (OpenAPI 3.0). Generated from the NestJS Swagger decorators across all modules.
# Covers Accounts/Auth, Users, Admin, Reports, Notifications, Blog, Airports, Airlines, Flights,
# Flight Bookings, Hotels, Hotel Bookings, Reviews, Payments/Policies/Refunds, and Itineraries.
openapi: 3.0.0
info:
  title: Travel Planning and Booking API
  description: >-
    Complete OpenAPI 3.0 specification for the Travel Planning and Booking Platform (Accounts/Auth, Admin, Flights,
    Airlines, Airports, Flight Bookings, Hotels, Hotel Bookings, Reviews, Payments & Refunds, Itineraries, Blog,
    Reports, and Notifications).
  version: '1.0'
  contact: {}
tags:
  - name: Auth
    description: 'Registration, email verification, login, refresh, logout and password recovery: ACC-01 to ACC-08, ACC-19'
  - name: Users
    description: 'Self-service profile management and account deactivation: ACC-09, ACC-11, ACC-12'
  - name: Admin
    description: >-
      Moderator creation, account/provider status, bookings overview, audit logs and report moderation: ACC-07a, ACC-13
      to ACC-17, GEN-07, GEN-10
  - name: Reports
    description: 'Registered users report posts, comments, reviews or itineraries: GEN-09'
  - name: Notifications
    description: 'In-app notifications (unread count, list, mark as read) paired with SMTP email delivery: GEN-01, GEN-01-B'
  - name: Upload
    description: >-
      Shared JPG/PNG image upload endpoint (max 5 MB) for airline logos, hotel photos, blog posts and itinerary
      activities: GEN-08, FLT-01, HTL-01
  - name: Blog
    description: 'Blog and community: BLG-01 to BLG-10, BLG-12, BLG-13'
  - name: Airports
    description: 'Predefined airports, read-only: FLT-02'
  - name: Airlines
    description: 'Airline profiles, baggage policies and cancellation tiers: FLT-01, FLT-04, FLT-08, FLT-09'
  - name: Flights
    description: >-
      Flight management, cabins, search, details, bookings manifest and passenger CSV export: FLT-03 to FLT-06, FLT-11,
      FLT-12, FLT-15, FLT-17, FLT-29
  - name: Flight bookings
    description: 'Flight booking holds, e-tickets, cancellations, flight changes and seat selection: FLT-19, FLT-21 to FLT-28'
  - name: Hotels
    description: 'Hotel profiles, rooms, availability, policies, search and reviews: HTL-01 to HTL-15, HTL-22, HTL-24'
  - name: Hotel bookings
    description: 'Hotel room reservations, 10-minute holds, cancellations and review submission: HTL-16 to HTL-21, HTL-23'
  - name: Reviews
    description: 'Edit/delete hotel reviews and moderator replies: HTL-23, HTL-26'
  - name: Payments
    description: 'Stripe PaymentIntents, policy display & acceptance, webhooks and refunds: PAY-01 to PAY-03'
  - name: Itineraries
    description: >-
      Itinerary planning, days, activities, budgets, FX conversion, cloning, bookings link and PDF export: ITN-01 to
      ITN-28
paths:
  /api/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseDto'
        '400':
          description: Invalid fields, weak password, consent not given, or unknown country
        '409':
          description: Email or username already registered
      summary: Register a new account (ACC-01)
      tags:
        - Auth
  /api/auth/verify-email:
    get:
      operationId: AuthController_verifyEmail
      parameters:
        - name: token
          required: true
          in: query
          description: The token from the verification email link
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Link invalid or expired
      summary: Verify an email address from the emailed link (ACC-02)
      tags:
        - Auth
  /api/auth/login:
    post:
      description: Sets the access_token and refresh_token httpOnly cookies. Tokens are never returned in the body.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '401':
          description: Invalid email or password
        '403':
          description: Account suspended or deactivated
        '423':
          description: Locked for 15 minutes after 5 failed attempts
      summary: Log in (ACC-04, ACC-05)
      tags:
        - Auth
  /api/auth/refresh:
    post:
      description: Rotates the refresh token. Call this when another request returns 401.
      operationId: AuthController_refresh
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '401':
          description: Session expired or revoked; cookies are cleared
        '403':
          description: Account suspended or deactivated
      summary: Get new tokens using the refresh_token cookie (ACC-06)
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      summary: 'Log out: revokes the session and clears the cookies (ACC-06)'
      tags:
        - Auth
  /api/auth/forgot-password:
    post:
      description: Always returns the same message, whether or not the email is registered.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      summary: Request a password-reset link by email (ACC-07)
      tags:
        - Auth
  /api/auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Token invalid, expired or already used, or weak password
      summary: Set a new password using the emailed reset token (ACC-07)
      tags:
        - Auth
  /api/auth/change-password:
    patch:
      description: Signs out your other sessions.
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Current password incorrect, or new password invalid
        '401':
          description: Not logged in
      security:
        - cookie: []
      summary: Change your password (ACC-08)
      tags:
        - Auth
  /api/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '401':
          description: Not logged in
        '403':
          description: Account suspended, deactivated or required to change its password
      security:
        - cookie: []
      summary: Get the logged-in user (ACC-19)
      tags:
        - Auth
  /api/users/me:
    get:
      operationId: UsersController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileDto'
        '401':
          description: Not logged in or session revoked
        '403':
          description: Account suspended, deactivated or required to change its password
      security:
        - cookie: []
      summary: Get your own profile (ACC-11)
      tags:
        - Users
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileDto'
        '400':
          description: Invalid fields, unknown currency or empty update
        '401':
          description: Not logged in or session revoked
        '403':
          description: Account suspended, deactivated or required to change its password
      security:
        - cookie: []
      summary: Edit your name, phone number or preferred currency (ACC-09)
      tags:
        - Users
    delete:
      description: >-
        Requires confirm=true. Blocks accounts with upcoming or ongoing confirmed bookings. Hides public content,
        anonymizes the retained author name, revokes sessions and clears auth cookies.
      operationId: UsersController_deactivateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateAccountDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Deactivation was not confirmed
        '401':
          description: Not logged in or session revoked
        '403':
          description: Only registered users may deactivate their own account
        '409':
          description: The account has upcoming confirmed bookings
      security:
        - cookie: []
      summary: Deactivate your account after confirmation (ACC-12)
      tags:
        - Users
  /api/admin/users/{id}/reset-password:
    post:
      description: Revokes existing sessions and reset links, and requires a new password at the next login.
      operationId: AdminUsersController_resetUserPassword
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the user or moderator
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Invalid account id or weak temporary password
        '401':
          description: Not logged in
        '403':
          description: Administrator access required, or target is an admin
        '404':
          description: Account not found
      security:
        - cookie: []
      summary: Reset a user's or moderator's password to a temporary password (ACC-07a)
      tags:
        - Admin
  /api/admin/moderators:
    post:
      description: >-
        Creates a hotel or airline moderator account linked to one hotel or airline (when providerId is provided), sets
        mustChangePassword=true for first login, sends an invitation email (GEN-01-B) and logs the action (GEN-07).
      operationId: AdminUsersController_createModerator
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModeratorDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDto'
        '400':
          description: Invalid body, role, weak temporary password, or mismatched provider type
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
        '404':
          description: Hotel or airline not found
        '409':
          description: Email or username is already registered
      security:
        - cookie: []
      summary: Create a hotel or airline moderator account with a temporary password (ACC-13)
      tags:
        - Admin
  /api/admin/accounts:
    get:
      description: >-
        Returns a paginated list of all user, moderator and admin accounts (name, email, role, status, registration
        date), newest first.
      operationId: AdminUsersController_listAccounts
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (10 items per page)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: search
          required: false
          in: query
          description: Case-insensitive search by name or email
          schema:
            maxLength: 100
            type: string
        - name: role
          required: false
          in: query
          description: Filter by account role
          schema:
            type: string
            enum:
              - user
              - admin
              - airline moderator
              - hotel moderator
        - name: status
          required: false
          in: query
          description: Filter by account status
          schema:
            type: string
            enum:
              - new
              - active
              - inactive
              - suspended
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsPageDto'
        '400':
          description: Invalid page, role or status filter
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
      security:
        - cookie: []
      summary: List all accounts with search by name or email and filter by role and status, 10 per page (ACC-14)
      tags:
        - Admin
  /api/admin/accounts/{id}/suspend:
    patch:
      description: >-
        Blocks the account from logging in, revokes its active sessions and refresh tokens, notifies the account holder
        and writes an audit log entry (GEN-07). Existing confirmed bookings remain valid.
      operationId: AdminUsersController_suspendAccount
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the user or moderator account to suspend
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDto'
        '400':
          description: Invalid account id or reason
        '401':
          description: Not logged in
        '403':
          description: Administrator access required, or target is an administrator
        '404':
          description: Account not found
        '409':
          description: Account is already suspended or deactivated
      security:
        - cookie: []
      summary: Suspend a registered user or moderator account (ACC-15, ACC-16)
      tags:
        - Admin
  /api/admin/accounts/{id}/reactivate:
    patch:
      description: >-
        Restores a suspended account to active status, clears any login lockout, notifies the account holder and writes
        an audit log entry (GEN-07).
      operationId: AdminUsersController_reactivateAccount
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the suspended user or moderator account to reactivate
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDto'
        '400':
          description: Invalid account id or reason
        '401':
          description: Not logged in
        '403':
          description: Administrator access required, or target is an administrator
        '404':
          description: Account not found
        '409':
          description: Account is already active or was self-deactivated
      security:
        - cookie: []
      summary: Reactivate a suspended user or moderator account (ACC-15, ACC-16)
      tags:
        - Admin
  /api/admin/providers/{type}/{id}/deactivate:
    patch:
      description: >-
        Hides the provider and its listings from public search and blocks new bookings while keeping existing confirmed
        bookings valid. Notifies the assigned moderator and writes an audit log entry (GEN-07).
      operationId: AdminUsersController_deactivateProvider
      parameters:
        - name: type
          required: true
          in: path
          description: 'Provider type: airline or hotel'
          schema:
            enum:
              - airline
              - hotel
            type: string
        - name: id
          required: true
          in: path
          description: Id of the hotel or airline to deactivate
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviderStatusResponseDto'
        '400':
          description: Invalid provider type, id or reason
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
        '404':
          description: Hotel or airline not found
        '409':
          description: Provider is already deactivated
      security:
        - cookie: []
      summary: Deactivate a hotel or airline (ACC-15)
      tags:
        - Admin
  /api/admin/providers/{type}/{id}/reactivate:
    patch:
      description: >-
        Restores the provider to active status so its listings appear in search and can be booked again. Notifies the
        assigned moderator and writes an audit log entry (GEN-07).
      operationId: AdminUsersController_reactivateProvider
      parameters:
        - name: type
          required: true
          in: path
          description: 'Provider type: airline or hotel'
          schema:
            enum:
              - airline
              - hotel
            type: string
        - name: id
          required: true
          in: path
          description: Id of the hotel or airline to reactivate
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviderStatusResponseDto'
        '400':
          description: Invalid provider type, id or reason
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
        '404':
          description: Hotel or airline not found
        '409':
          description: Provider is already active
      security:
        - cookie: []
      summary: Reactivate a deactivated hotel or airline (ACC-15)
      tags:
        - Admin
  /api/admin/bookings:
    get:
      description: >-
        Returns a paginated, read-only list of all flight bookings and hotel reservations showing reference, user,
        provider, dates, amount and status.
      operationId: AdminUsersController_listBookings
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (10 items per page)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: type
          required: false
          in: query
          description: Filter by booking type (flight or hotel)
          schema:
            type: string
            enum:
              - flight
              - hotel
        - name: status
          required: false
          in: query
          description: Filter by booking status
          schema:
            type: string
            enum:
              - pending payment
              - confirmed
              - completed
              - expired
              - cancelled
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD or ISO-8601)
          schema:
            example: '2026-11-01'
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD or ISO-8601)
          schema:
            example: '2026-12-31'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingsPageDto'
        '400':
          description: Invalid filter or date range (e.g. from > to)
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
      security:
        - cookie: []
      summary: List all flight and hotel bookings (read-only), filterable by type, status and date range, 10 per page (ACC-17)
      tags:
        - Admin
  /api/admin/audit-logs:
    get:
      description: >-
        Returns the chronological audit trail of administrative actions (suspensions, password resets, report
        resolutions, content hiding and deletions), newest first.
      operationId: AdminModerationController_listAuditLogs
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (10 items per page)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: action
          required: false
          in: query
          description: Filter by admin action type
          schema:
            type: string
            enum:
              - create_moderator
              - reset_password
              - suspend_user
              - reactivate_user
              - deactivate_provider
              - reactivate_provider
              - dismiss_report
              - hide_content
              - delete_content
        - name: targetType
          required: false
          in: query
          description: Filter by target entity type
          schema:
            type: string
            enum:
              - user
              - airline
              - hotel
              - report
              - post
              - comment
              - review
              - itinerary
        - name: adminId
          required: false
          in: query
          description: Filter by admin account id
          schema:
            example: 665f1c2e9b1e8a0012345671
            type: string
        - name: targetId
          required: false
          in: query
          description: Filter by target entity id
          schema:
            example: 665f1c2e9b1e8a0012345672
            type: string
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD or ISO-8601)
          schema:
            example: '2026-11-01'
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD or ISO-8601)
          schema:
            example: '2026-11-30'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsPageDto'
        '400':
          description: Invalid filter or date range (e.g. from > to)
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
      security:
        - cookie: []
      summary: List admin audit logs with optional filters, 10 per page (GEN-07)
      tags:
        - Admin
  /api/admin/reports:
    get:
      description: >-
        Lists user reports on posts, comments, reviews and itineraries with reporter details and a preview of the
        reported item.
      operationId: AdminModerationController_listReports
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (10 items per page)
          schema:
            minimum: 1
            default: 1
            type: number
        - name: status
          required: false
          in: query
          description: Report status filter (defaults to open reports per GEN-10)
          schema:
            default: open
            type: string
            enum:
              - open
              - dismissed
              - hidden
              - deleted
        - name: targetType
          required: false
          in: query
          description: Filter by reported content type
          schema:
            type: string
            enum:
              - post
              - comment
              - review
              - itinerary
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsPageDto'
        '400':
          description: Invalid page or filter value
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
      security:
        - cookie: []
      summary: List content reports (defaults to open reports), 10 per page (GEN-09, GEN-10)
      tags:
        - Admin
  /api/admin/reports/{id}:
    patch:
      description: >-
        Hiding content makes it visible only to its author and admins. Every resolution is recorded in the admin audit
        log (GEN-07).
      operationId: AdminModerationController_resolveReport
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the report to resolve
          schema:
            example: 665f1c2e9b1e8a0012345681
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEntryDto'
        '400':
          description: Invalid report id or resolution body
        '401':
          description: Not logged in
        '403':
          description: Administrator access required
        '404':
          description: Report or reported content not found
        '409':
          description: Report has already been resolved
      security:
        - cookie: []
      summary: Resolve an open report by dismissing it, hiding the content or deleting it (GEN-10)
      tags:
        - Admin
  /api/admin/content/{type}/{id}:
    delete:
      description: >-
        Permanently deletes the target content item, cleans up dependent records (or recalculates hotel average rating
        for a review), resolves any open reports on the item, and writes an audit log entry (GEN-07).
      operationId: AdminModerationController_deleteContent
      parameters:
        - name: type
          required: true
          in: path
          description: Content type (post, comment, review or itinerary)
          schema:
            enum:
              - post
              - comment
              - review
              - itinerary
            type: string
            example: post
        - name: id
          required: true
          in: path
          description: Id of the content item to delete
          schema:
            example: 665f1c2e9b1e8a0012345682
            type: string
        - name: reason
          required: false
