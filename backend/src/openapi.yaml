components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    RegisterDto:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
        emailAddress:
          type: string
          maxLength: 254
          description: Must not already be registered
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: Letters, numbers, dots and underscores. Stored in lowercase; must be unique
        password:
          type: string
          description: At least 8 characters, including at least one letter and one digit
          minLength: 8
          maxLength: 72
        acceptedTerms:
          type: boolean
          description: Mandatory terms-and-privacy consent checkbox; must be true
        phoneNumber:
          type: string
          description: E.164 format
        countryOfOriginId:
          type: string
          description: Id of an existing country
      required:
        - fullName
        - emailAddress
        - username
        - password
        - acceptedTerms
        - countryOfOriginId
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        emailAddress:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
            - airline moderator
            - hotel moderator
        isVerified:
          type: boolean
          description: 'ACC-02: bookings require a verified email'
      required:
        - id
        - fullName
        - emailAddress
        - username
        - role
        - isVerified
    RegisterResponseDto:
      type: object
      properties:
        user:
