      summary: Get flight details with cabins, seats remaining, baggage allowance and cancellation policy (FLT-17)
      tags:
        - Flights
    patch:
      description: >-
        Local times as on creation. Changing an airport also needs that side's local time. A side whose time is not sent
        keeps its stored time. Any departure or arrival time change sends an in-app notification (GEN-01) and SMTP email
        notification (GEN-01-B) to passengers with Confirmed bookings (FLT-05).
      operationId: FlightsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: Flight id
          schema:
            type: string
