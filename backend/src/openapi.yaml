          description: Each cabin type at most once per flight
        seatPrice:
          type: number
          description: Price per seat in cents (> 0)
          example: 45000
          minimum: 1
        seatCount:
          type: number
          description: >-
            Total seat count in this cabin (whole number > 0, FLT-04); must match (lastRow - firstRow + 1) * seatsPerRow
