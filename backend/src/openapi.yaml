        '404':
          description: Flight not found
      security:
        - cookie: []
      summary: Download the passenger list of your flight as CSV
      tags:
        - Flights
  /api/flights:
    post:
      description: >-
        Times are local to each airport (its city's IANA time zone) and stored in UTC. Seats are generated from each
        cabin's rows and layout.
      operationId: FlightsController_create
      parameters: []
      requestBody:
        required: true
