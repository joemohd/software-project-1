        over rooms of nights x price per night (in cents, at booking time). The rooms are held together as one Pending
        Payment booking until holdExpiresAt; if any room is blocked or already booked or held for overlapping dates,
        nothing is held. Then accept the policies (POST /api/bookings/hotel/:id/accept-policies) and pay (POST
        /api/payments).
