<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly — Admin accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F55D6}a:hover{color:#163F9F}
input:focus,select:focus{outline:none;border-color:#1F55D6 !important;box-shadow:0 0 0 3px rgba(31,85,214,.18)}
button:focus-visible,a:focus-visible{outline:2px solid #1F55D6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F6FA; font-family: Inter, system-ui, sans-serif; color: #0B1B33;">

  <aside style="flex: 1 1 240px; max-width: 100%; background: #0B1B33; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
      <span style="width: 32px; height: 32px; border-radius: 8px; background: #1F55D6; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700;">Fly</span>
      <span style="margin-left: auto; padding: 3px 8px; border-radius: 6px; background: #F59E0B; font-size: 11px; font-weight: 700; color: #0B1B33;">Admin</span>
    </div>
    <nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 2px;">
      <a href="#" aria-current="page" style="padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.12); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600;">Accounts</a>
      <a href="#" style="padding: 12px; border-radius: 8px; color: #C3CEE0; text-decoration: none; font-size: 14px;">Airlines &amp; hotels</a>
      <a href="#" style="padding: 12px; border-radius: 8px; color: #C3CEE0; text-decoration: none; font-size: 14px;">All bookings</a>
      <a href="#" style="padding: 12px; border-radius: 8px; color: #C3CEE0; text-decoration: none; font-size: 14px; display: flex; justify-content: space-between;">Reports <span style="padding: 0 8px; border-radius: 999px; background: #F59E0B; color: #0B1B33; font-size: 12px; font-weight: 700;">3</span></a>
      <a href="#" style="padding: 12px; border-radius: 8px; color: #C3CEE0; text-decoration: none; font-size: 14px;">Audit log</a>
    </nav>
  </aside>

  <main style="flex: 999 1 640px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600;">Accounts</h1>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #1F55D6; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600;">+ Create moderator</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
      <div style="position: relative; flex: 1 1 280px;">
        <label for="a-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search by name or email</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 15px;"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="a-q" placeholder="Search by name or email" style="width: 100%; height: 48px; padding: 0 14px 0 42px; border: 1px solid #C9D1DE; border-radius: 10px; font: inherit; font-size: 15px; box-sizing: border-box; background: #FFFFFF;">
      </div>
      <div role="group" aria-label="Filter by role" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: #E6EAF2; border-radius: 10px;">
        <sc-for list="{{ roles }}" as="r" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{ r.pressed }}" onClick="{{ r.pick }}" style="{{ r.style }}">{{ r.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 14px; overflow-x: auto;">
      <table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14px;">
        <thead>
          <tr style="text-align: left; color: #4A5568; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;">
            <th scope="col" style="padding: 14px 20px; font-weight: 600;">Name</th>
            <th scope="col" style="padding: 14px 12px; font-weight: 600;">Role</th>
            <th scope="col" style="padding: 14px 12px; font-weight: 600;">Status</th>
            <th scope="col" style="padding: 14px 12px; font-weight: 600;">Registered</th>
            <th scope="col" style="padding: 14px 20px; font-weight: 600; text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{ rows }}" as="u" hint-placeholder-count="6">
            <tr style="border-top: 1px solid #EEF1F6;">
              <td style="padding: 14px 20px;"><div style="font-weight: 600;">{{ u.name }}</div><div style="font-size: 13px; color: #5A6578;">{{ u.email }}</div></td>
              <td style="padding: 14px 12px;">{{ u.roleLabel }}</td>
              <td style="padding: 14px 12px;"><span style="padding: 3px 10px; border-radius: 999px; background: {{ u.statusBg }}; color: {{ u.statusFg }}; font-size: 12px; font-weight: 600;">{{ u.status }}</span></td>
              <td style="padding: 14px 12px; color: #4A5568;">{{ u.joined }}</td>
              <td style="padding: 14px 20px; text-align: right; white-space: nowrap;">
                <button type="button" style="border: 0; background: none; color: #1F55D6; font: inherit; font-weight: 600; cursor: pointer; padding: 10px 8px;">Reset password</button>
                <button type="button" onClick="{{ u.toggle }}" style="{{ u.actionStyle }}">{{ u.action }}</button>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #4A5568;">
      <span>Showing {{ count }} accounts</span>
      <div style="display: flex; gap: 6px;">
        <button type="button" aria-current="page" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #0B1B33; color: #FFFFFF; font: inherit; font-weight: 600;">1</button>
        <button type="button" style="width: 44px; height: 44px; border: 1px solid #DDE3EC; border-radius: 10px; background: #FFFFFF; color: #0B1B33; font: inherit;">2</button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'all', suspended: ['u4'] };
  }
  renderVals() {
    const users = [
      { id: 'u1', name: 'Laila Hassan', email: 'laila@example.com', role: 'user', joined: '3 Oct 2026' },
      { id: 'u2', name: 'Youssef Nabil', email: 'y.nabil@example.com', role: 'airline', joined: '12 Oct 2026', provider: 'Meridian Air' },
      { id: 'u3', name: 'Mariam Fawzy', email: 'mariam.f@example.com', role: 'hotel', joined: '14 Oct 2026', provider: 'Palm Creek Hotel' },
      { id: 'u4', name: 'Tarek Samir', email: 'tarek.s@example.com', role: 'user', joined: '22 Oct 2026' },
      { id: 'u5', name: 'Hana Mostafa', email: 'hana.m@example.com', role: 'user', joined: '1 Nov 2026' },
      { id: 'u6', name: 'Ziad Kamal', email: 'z.kamal@example.com', role: 'airline', joined: '9 Nov 2026', provider: 'Sahara Wings' }
    ];
    const labels = { user: 'Traveller', airline: 'Airline mod', hotel: 'Hotel mod' };
    const seg = (on) => 'height: 40px; padding: 0 14px; border: 0; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #0B1B33; box-shadow: 0 1px 2px rgba(11,27,51,.12);' : 'background: transparent; color: #4A5568;');
    const roles = [{ id: 'all', label: 'All' }, { id: 'user', label: 'Travellers' }, { id: 'airline', label: 'Airline mods' }, { id: 'hotel', label: 'Hotel mods' }].map((r) => ({ ...r, pressed: String(this.state.role === r.id), style: seg(this.state.role === r.id), pick: () => this.setState({ role: r.id }) }));
    const sus = this.state.suspended;
    const rows = users.filter((u) => this.state.role === 'all' || u.role === this.state.role).map((u) => {
      const off = sus.includes(u.id);
      return {
        ...u,
        roleLabel: u.provider ? labels[u.role] + ' · ' + u.provider : labels[u.role],
        status: off ? 'Suspended' : 'Active',
        statusBg: off ? '#FDECEC' : '#E3F4EA',
        statusFg: off ? '#8A1C1C' : '#1B5E36',
        action: off ? 'Reactivate' : 'Suspend',
        actionStyle: 'border: 0; background: none; font: inherit; font-weight: 600; cursor: pointer; padding: 10px 8px; color: ' + (off ? '#1B7A43' : '#B42318') + ';',
        toggle: () => this.setState({ suspended: off ? sus.filter((x) => x !== u.id) : sus.concat(u.id) })
      };
    });
    return { roles, rows, count: rows.length };
  }
}
</script>
</body>
</html>
